
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projets - Ton Prénom</title>

<style>

/* ====== CSS IDENTIQUE À "À PROPOS" ====== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', 'Segoe UI', sans-serif;
}

body {
    background: linear-gradient(135deg, #050817, #0a0f2c, #071426);
    color: #e6fff8;
    line-height: 1.7;
}

a {
    text-decoration: none;
    transition: 0.3s ease;
}

/* PROFILE HEADER */
.profile-header {
    padding: 4rem 8%;
}

.profile-container {
    display: flex;
    align-items: center;
    gap: 3rem;
    background: rgba(10, 15, 44, 0.7);
    backdrop-filter: blur(20px);
    padding: 3rem;
    border-radius: 30px;
    box-shadow: 
        0 25px 60px rgba(0,0,0,0.7),
        0 0 40px rgba(0,255,170,0.15);
    border: 1px solid rgba(0,255,170,0.2);
}

.profile-photo img {
    width: 180px;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,255,170,0.4);
}

.profile-info h1 {
    font-size: 2.4rem;
    margin-bottom: 0.5rem;
    background: linear-gradient(90deg, #00ffaa, #00cc88);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.profile-info p {
    color: #c8fff0;
    margin-bottom: 0.5rem;
}

.profile-links {
    margin-top: 1.2rem;
}

.profile-links a {
    display: inline-block;
    margin-right: 15px;
    padding: 10px 20px;
    border-radius: 30px;
    background: linear-gradient(135deg, #00ffaa, #00cc88);
    color: #050817;
    font-weight: 600;
    box-shadow: 0 10px 25px rgba(0,255,170,0.3);
}

/* ABOUT */
.about-hero {
    padding: 6rem 8%;
}

.about-container {
    display: grid;
    grid-template-columns: 1fr 1.2fr;
    gap: 4rem;
    align-items: center;
    background: rgba(10, 15, 44, 0.7);
    backdrop-filter: blur(20px);
    padding: 4rem;
    border-radius: 30px;
    box-shadow: 
        0 25px 60px rgba(0,0,0,0.7),
        0 0 40px rgba(0,255,170,0.15);
    border: 1px solid rgba(0,255,170,0.2);
}

/* TIMELINE */
.timeline {
    padding: 6rem 10%;
}

.timeline h2 {
    text-align: center;
    font-size: 2.4rem;
    margin-bottom: 4rem;
    background: linear-gradient(90deg, #00ffaa, #00cc88);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.timeline-container {
    display: flex;
    flex-direction: column;
    gap: 3rem;
    position: relative;
}

.timeline-container::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 0;
    width: 4px;
    height: 100%;
    background: linear-gradient(180deg, #00ffaa, #00cc88);
    transform: translateX(-50%);
    border-radius: 10px;
}

.timeline-item {
    width: 45%;
    background: rgba(10, 15, 44, 0.8);
    backdrop-filter: blur(15px);
    padding: 2rem;
    border-radius: 22px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.7);
    border: 1px solid rgba(0,255,170,0.2);
}

/* CTA */
.cta {
    margin: 6rem 8%;
    padding: 4rem;
    background: linear-gradient(135deg, #071426, #050817);
    text-align: center;
    border-radius: 35px;
    box-shadow: 0 30px 60px rgba(0,255,170,0.3);
}

.cta h2 {
    font-size: 2.2rem;
    margin-bottom: 1.5rem;
    color: #00ffaa;
}

/* PROJECTS (ajout léger pour adapter) */
.projects-section {
padding: 4rem 2rem;
}

.projects-container {
max-width: 1200px;
margin: 0 auto;
display: grid;
grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
gap: 2rem;
}

.project-card {
background: rgba(10, 15, 44, 0.7);
padding: 2rem;
border-radius: 15px;
box-shadow: 0 15px 30px rgba(0,0,0,0.3);
}

.project-card h3 {
color: #00ffaa;
margin-bottom: 1rem;
}

.project-card p {
color: #c8fff0;
}

/* RESPONSIVE */
@media (max-width: 900px) {
    .profile-container {
        flex-direction: column;
        text-align: center;
    }

    .about-container {
        grid-template-columns: 1fr;
        text-align: center;
    }
}

</style>
</head>

<body>
<section class="projects-section">
<h1 style="text-align:center; margin-bottom:3rem; color:#00ffaa;">Mes Projets</h1>

<div class="projects-container">

<div class="project-card">
<h3>Portfolio Personnel</h3>
<p>Création d’un site portfolio en HTML, CSS et PHP.</p>
</div>

<div class="project-card">
<h3>Formulaire Authentification</h3>
<p>Système login / inscription avec PHP & MySQL.</p>
</div>

<div class="project-card">
<h3>Site E-commerce</h3>
<p>Gestion produits et panier dynamique.</p>
</div>

<div class="project-card">
<h3>Jeu en C</h3>
<p>Logique algorithmique en langage C.</p>
</div>

</div>
</section>
</body>
</html>
